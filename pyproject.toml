[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-anomaly-detector"
version = "0.2.0"
description = "Research prototype: unsupervised anomaly detection on web/auth logs, evaluated on the public AIT-LDSv2 dataset"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Adrián Infantes Romero"}]
keywords = ["siem", "anomaly-detection", "log-analysis", "detection-engineering", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "structlog>=23.2",
    "prometheus-client>=0.19",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/infantesromeroadrian/SIEM-Anomaly-Detector-ML"
Issues = "https://github.com/infantesromeroadrian/SIEM-Anomaly-Detector-ML/issues"

[tool.setuptools.packages.find]
include = ["backend*"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["frontend", "models", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "PIE", "RUF100"]
ignore = [
    "S101",  # assert is fine in tests
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI Depends/Query defaults
    "S311",  # random is used only by the synthetic demo generator
    "S104",  # binding 0.0.0.0 inside the container is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ----------------------------------------------------------------------------
# Pytest / coverage (coverage gate is enforced in CI, not here)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
